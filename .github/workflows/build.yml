name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android .
      - name: Android sozlamalari
        run: |
          python3 - <<'PYEOF'
          import re, os, glob

          def rd(p):
              return open(p, encoding='utf-8').read()

          def wr(p, s):
              open(p, 'w', encoding='utf-8').write(s)

          # 1. Manifest: ruxsatlar, bildirishnoma qabul qiluvchilari, nom
          p = 'android/app/src/main/AndroidManifest.xml'
          s = rd(p)
          names = ['USE_BIOMETRIC', 'POST_NOTIFICATIONS', 'RECEIVE_BOOT_COMPLETED', 'VIBRATE']
          perms = ''.join('<uses-permission android:name="android.permission.%s"/>\n' % n for n in names)
          s = s.replace('<application', perms + '<application', 1)
          recv = ('<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>\n'
                  '<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">'
                  '<intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/>'
                  '<action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver>\n')
          s = s.replace('</application>', recv + '</application>', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="DORO"', s, count=1)
          wr(p, s)

          # 2. MainActivity: biometrik uchun FlutterFragmentActivity
          for f in glob.glob('android/app/src/main/**/MainActivity.*', recursive=True):
              m = re.search(r'package\s+([\w.]+)', rd(f))
              if m:
                  wr(f, 'package %s\n\nimport io.flutter.embedding.android.FlutterFragmentActivity\n\nclass MainActivity : FlutterFragmentActivity()\n' % m.group(1))

          # 3. Gradle: core library desugaring (bildirishnoma uchun)
          kts = 'android/app/build.gradle.kts'
          if os.path.exists(kts):
              s = rd(kts)
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              wr(kts, s)
          else:
              g = 'android/app/build.gradle'
              s = rd(g)
              s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              wr(g, s)

          # 4. Mavzu: local_auth uchun AppCompat
          for f in glob.glob('android/app/src/main/res/values*/styles.xml'):
              s = rd(f)
              s = s.replace('@android:style/Theme.Light.NoTitleBar', 'Theme.AppCompat.Light.NoActionBar')
              s = s.replace('@android:style/Theme.Black.NoTitleBar', 'Theme.AppCompat.NoActionBar')
              wr(f, s)
          PYEOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: doro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
